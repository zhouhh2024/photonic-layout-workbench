[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photonic-cluster-generator"
version = "0.5.0"
description = "Black-box GDS onboarding, hierarchical photonic cluster assembly, and LVS evidence"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "zhouhh2024" }]
requires-python = ">=3.10,<3.13"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "gdsfactory>=8.32,<9",
  "gdstk>=0.9",
  "numpy>=1.24",
  "Pillow>=10",
  "shapely>=2.0",
]

[project.scripts]
photonic-cluster = "photonic_cluster_generator.cli:main"

[project.urls]
Repository = "https://github.com/zhouhh2024/photonic-layout-workbench"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
photonic_cluster_generator = ["editor/static/*.html"]
