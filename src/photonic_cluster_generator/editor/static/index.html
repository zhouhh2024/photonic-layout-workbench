<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>光子版图工作台 · 版图装配</title>
  <style>
    :root{font-family:Inter,"Microsoft YaHei",sans-serif;color:#e7edf5;background:#0d1218;--line:#293543;--panel:#131a23;--soft:#9ba9ba;--blue:#42a5ff;--yellow:#ffd45c;--red:#ff6b6b}
    *{box-sizing:border-box}body{margin:0;height:100vh;display:grid;grid-template-columns:290px minmax(0,1fr) 330px;grid-template-rows:58px minmax(0,1fr) 34px;background:#0d1218;overflow:hidden}
    header{grid-column:1/4;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:9px 14px;background:#111821}header h1{font-size:17px;margin:0 4px 0 0;white-space:nowrap}header input{width:200px}.module-nav{display:flex;gap:4px;margin-right:10px}.module-nav a{color:var(--soft);text-decoration:none;padding:7px 10px;border:1px solid transparent;border-radius:6px;font-size:13px}.module-nav a:hover{border-color:#3b4b5e}.module-nav a.active{color:#fff;background:#1b2a38;border-color:#4777a8}.left,.right{background:var(--panel);overflow:auto;padding:12px}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}
    .stage{position:relative;overflow:hidden;background-color:#080c11;background-image:linear-gradient(#15202c 1px,transparent 1px),linear-gradient(90deg,#15202c 1px,transparent 1px);background-size:22px 22px}.stage svg{width:100%;height:100%;touch-action:none;user-select:none}.layer-toolbar{position:absolute;z-index:2;left:10px;top:10px;max-width:calc(100% - 20px);display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:6px 8px;border:1px solid #334154;border-radius:8px;background:rgba(17,24,33,.92);box-shadow:0 2px 8px #0008}.layer-toolbar>span{font-size:11px;color:var(--soft);margin-right:2px}.layer-chip{display:flex;align-items:center;gap:5px;padding:4px 7px;font-size:11px}.layer-chip.off{opacity:.38}.layer-swatch{width:8px;height:8px;border-radius:2px}.statusbar{grid-column:1/4;border-top:1px solid var(--line);padding:7px 14px;color:var(--soft);font-size:12px;background:#111821;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    input,select,button{font:inherit;color:inherit;background:#1a2430;border:1px solid #3b4b5e;border-radius:6px;padding:7px 9px}button{cursor:pointer}button:hover{border-color:#629bd0}button.primary{background:#1767a8;border-color:#2e8ad2;font-weight:700}button.danger{border-color:#783d46;color:#ffb6be}button:disabled{opacity:.42;cursor:not-allowed}.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.left,.right{min-width:0}.hint,.artifact{overflow-wrap:anywhere}.hint{color:var(--soft);font-size:12px;line-height:1.55}.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#8192a6;margin:13px 0 7px}.search{width:100%;margin-bottom:8px}.library-item{padding:9px;margin:4px 0;border:1px solid transparent;border-radius:7px;cursor:grab;background:#171f29}.library-item:hover{border-color:#3e6d97;background:#1a2734}.library-item b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag{display:inline-block;font-size:10px;border:1px solid #425267;border-radius:999px;padding:1px 5px;margin:4px 4px 0 0;color:#b8c5d4}.tag.user{border-color:#38795c;color:#a8e8c3}.tag.parametric{border-color:#725a2c;color:#f4d18e}
    .device-shape{cursor:move}.device-shape.selected{filter:drop-shadow(0 0 3px #ffd45c)}.device-box{fill:none;stroke:transparent;stroke-width:.5;vector-effect:non-scaling-stroke;pointer-events:all}.device-box.selected{stroke:#ffd45c;stroke-dasharray:3 2}.port{stroke:#fff;stroke-width:.7;vector-effect:non-scaling-stroke;cursor:pointer}.port:hover,.port.pending{stroke:#ffd45c;stroke-width:1.6}.port.used{fill:#67d391}.device-label{fill:#f4f7fb;paint-order:stroke;stroke:#091018;stroke-width:2px;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none;opacity:0}.device-label.visible{opacity:1}.net{fill:none;stroke:#ff9b4a;stroke-width:1.1;vector-effect:non-scaling-stroke}.net.direct{stroke:#5ee1a2}.net.routed{stroke-dasharray:4 2}.net-label{fill:#ffc28d;paint-order:stroke;stroke:#091018;stroke-width:2px;vector-effect:non-scaling-stroke;pointer-events:none;opacity:0}.net-label.visible{opacity:1}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{margin:8px 0}.field label{display:block;font-size:11px;color:var(--soft);margin-bottom:4px}.field input,.field select{width:100%}.card{padding:10px;border:1px solid var(--line);border-radius:8px;background:#101720;margin-bottom:9px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.connection{font-size:12px;padding:7px 0;border-bottom:1px solid #26313d}.connection button{padding:3px 7px}.error{color:#ff9aa5}.success{color:#77e1ad}.artifact a{color:#75bfff;text-decoration:none;display:block;padding:3px 0}.artifact img{max-width:100%;margin-top:8px;border:1px solid var(--line);border-radius:6px}.empty{padding:25px;text-align:center;color:var(--soft)}
  </style>
</head>
<body>
  <header>
    <h1>光子版图工作台</h1>
    <nav class="module-nav"><a class="active" href="/">版图装配</a><a href="/register">器件注册</a></nav>
    <label>版图名 <input id="clusterName" value="WEB_ASSEMBLY" maxlength="32"></label>
    <div class="toolbar">
      <button id="fit">适配画布</button>
      <button id="rotate">旋转 90°</button>
      <button id="clear">清空</button>
      <button id="refreshLibrary">刷新器件库</button>
      <button class="primary" id="export">导出并验证 GDS</button>
    </div>
  </header>

  <aside class="left">
    <div class="section-title">器件库</div>
    <input class="search" id="librarySearch" placeholder="搜索模板或器件族">
    <div class="hint">拖放或双击添加器件。</div>
    <div id="library"></div>
  </aside>

  <main class="stage" id="stage">
    <div class="layer-toolbar"><span>图层</span><div id="layerControls" class="row"><span class="hint">添加器件后显示</span></div></div>
    <svg id="canvas" viewBox="-120 -90 240 180" preserveAspectRatio="xMidYMid meet">
      <g id="nets"></g><g id="devices"></g><g id="labels"></g>
    </svg>
  </main>

  <aside class="right">
    <div class="section-title">画布草稿</div>
    <div class="row"><button id="saveDraft">保存</button><button id="restoreDraft">恢复</button><button id="clearDraft">清除</button></div>
    <div class="hint" id="draftStatus">正在检查草稿…</div>
    <div id="inspector"><div class="empty">右键器件设置参数<br>单击端口后再单击另一端口可布线</div></div>
    <div class="section-title">连接</div>
    <div id="connections" class="hint">尚无连接</div>
    <div class="section-title">导出结果</div>
    <div id="artifacts" class="hint">未导出。未连接端口会自动作为外部端口写入。</div>
  </aside>

  <footer class="statusbar" id="status">正在读取器件库…</footer>

  <script>
    const state={library:[],instances:[],nets:[],selected:null,pending:null,drag:null,hovered:null,hiddenLayers:new Set(),ready:false};
    let draftTimer=null,draftSaving=false,draftQueued=false;
    const q=s=>document.querySelector(s), svg=q('#canvas');
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const status=(message,kind='')=>{q('#status').className='statusbar '+kind;q('#status').textContent=message};
    async function api(url,options){const response=await fetch(url,options);const value=await response.json();if(!response.ok)throw Error(value.error||response.statusText);return value}
    async function post(url,value){return api(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(value)})}
    const normalize=a=>((a%360)+360)%360;
    function rotatePoint(point,rotation){const a=rotation*Math.PI/180,c=Math.cos(a),s=Math.sin(a);return[c*point[0]-s*point[1],s*point[0]+c*point[1]]}
    function globalPort(instance,port){const p=rotatePoint(port.center_um,instance.placement.rotation_deg);return{x:p[0]+instance.placement.x_um,y:p[1]+instance.placement.y_um,orientation:normalize(port.orientation_deg+instance.placement.rotation_deg),layer:port.layer,width:port.width_um}}
    function compatible(a,b){return a.layer[0]===b.layer[0]&&a.layer[1]===b.layer[1]&&Math.abs(a.width-b.width)<=1e-6}
    function terminalKey(instanceId,portName){return instanceId+'::'+portName}
    function nextIndexedName(prefix,names){const used=new Set(names.map(String));let index=1;while(used.has(prefix+index))index++;return prefix+index}
    function nextNetId(){return nextIndexedName('N_',state.nets.map(net=>net.id))}
    function nextInstanceId(base){return nextIndexedName(base+'_',state.instances.map(instance=>instance.id))}
    function reindexNets(){state.nets.forEach((net,index)=>net.id='N_'+(index+1))}
    function usedTerminals(){const used=new Set();state.nets.forEach(net=>net.terminals.forEach(t=>used.add(terminalKey(t.instance,t.port))));return used}
    function incident(instanceId){return state.nets.filter(n=>n.terminals.some(t=>t.instance===instanceId))}
    function connectedInstanceIds(startId){const found=new Set([startId]),queue=[startId];while(queue.length){const current=queue.shift();incident(current).forEach(net=>net.terminals.forEach(terminal=>{if(!found.has(terminal.instance)){found.add(terminal.instance);queue.push(terminal.instance)}}))}return[...found]}
    function itemFor(instance){return state.library.find(item=>item.key===instance.library_key)}
    function instanceById(id){return state.instances.find(item=>item.id===id)}
    function portByName(instance,name){return instance.preview.ports.find(port=>port.name===name)}
    function serializeInstances(){return state.instances.map(i=>({id:i.id,component:i.component,parameters:i.parameters,placement:i.placement}))}
    function serializeDraftInstances(){return state.instances.map(i=>({id:i.id,library_key:i.library_key,parameters:i.parameters,placement:i.placement}))}
    function draftSnapshot(){return{schema_version:1,cluster_name:q('#clusterName').value.trim()||'WEB_ASSEMBLY',instances:serializeDraftInstances(),nets:state.nets,hidden_layers:[...state.hiddenLayers]}}
    function setDraftStatus(message,error=false){q('#draftStatus').className='hint'+(error?' error':'');q('#draftStatus').textContent=message}
    function scheduleDraftSave(){if(!state.ready)return;clearTimeout(draftTimer);draftTimer=setTimeout(()=>saveDraft(false),700)}
    async function saveDraft(manual=false){clearTimeout(draftTimer);if(!state.ready)return;if(draftSaving){draftQueued=true;return}draftSaving=true;if(manual)setDraftStatus('正在保存…');try{const result=await post('/api/draft',draftSnapshot());setDraftStatus(`已保存 · ${result.instance_count} 个器件 · ${result.net_count} 条连接`);if(manual)status('画布草稿已保存','success')}catch(error){setDraftStatus('保存失败：'+error.message,true);if(manual)status('草稿保存失败：'+error.message,'error')}finally{draftSaving=false;if(draftQueued){draftQueued=false;saveDraft(false)}}}
    async function restoreDraft(automatic=false){clearTimeout(draftTimer);if(!automatic&&state.instances.length&&!confirm('恢复草稿会替换当前画布，是否继续？'))return false;const result=await api('/api/draft');if(!result.exists){setDraftStatus('暂无草稿');if(!automatic)status('没有可恢复的画布草稿');return false}const draft=result.draft,instances=await Promise.all(draft.instances.map(async raw=>{const item=state.library.find(value=>value.key===raw.library_key);if(!item)throw Error(`草稿中的模板已不存在：${raw.library_key}`);const preview=await post('/api/preview',{key:raw.library_key,parameters:raw.parameters});return{id:raw.id,library_key:raw.library_key,component:preview.component,parameters:preview.parameters,placement:raw.placement,preview}}));state.instances=instances;state.nets=draft.nets;state.hiddenLayers=new Set(draft.hidden_layers||[]);reindexNets();state.selected=null;state.pending=null;state.hovered=null;q('#clusterName').value=draft.cluster_name;q('#artifacts').textContent='未导出。未连接端口会自动作为外部端口写入。';render();fitView();updateCanvasOverlays();setDraftStatus(`已恢复 · ${instances.length} 个器件 · ${state.nets.length} 条连接`);status('画布草稿已恢复','success');return true}
    async function clearDraft(){clearTimeout(draftTimer);try{await post('/api/draft/clear',{});setDraftStatus('暂无草稿');status('画布草稿已清除','success')}catch(error){setDraftStatus('清除失败：'+error.message,true);status('草稿清除失败：'+error.message,'error')}}
    const PORT_RADIUS_PX=3,LABEL_FONT_PX=9,LABEL_GAP_PX=4,NET_LABEL_FONT_PX=8,NET_LABEL_GAP_PX=3;
    function svgUnitsForPixels(pixels){const v=svg.viewBox.baseVal,w=Math.max(svg.clientWidth,1),h=Math.max(svg.clientHeight,1),scale=Math.min(w/Math.max(v.width,1e-9),h/Math.max(v.height,1e-9));return pixels/Math.max(scale,1e-9)}
    function portMarkerRadius(){return svgUnitsForPixels(PORT_RADIUS_PX)}
    function updatePortMarkers(){const radius=portMarkerRadius();document.querySelectorAll('#devices .port').forEach(node=>node.setAttribute('r',radius))}
    function updateDeviceLabels(){const fontSize=svgUnitsForPixels(LABEL_FONT_PX),gap=svgUnitsForPixels(LABEL_GAP_PX);document.querySelectorAll('#labels .device-label').forEach(node=>{node.setAttribute('font-size',fontSize);node.setAttribute('x',Number(node.dataset.left)+gap);node.setAttribute('y',-Number(node.dataset.top)-gap)})}
    function updateNetLabels(){const fontSize=svgUnitsForPixels(NET_LABEL_FONT_PX),gap=svgUnitsForPixels(NET_LABEL_GAP_PX);document.querySelectorAll('#nets .net-label').forEach(node=>{node.setAttribute('font-size',fontSize);node.setAttribute('x',node.dataset.centerX);node.setAttribute('y',Number(node.dataset.centerY)-gap)})}
    function updateCanvasOverlays(){updatePortMarkers();updateDeviceLabels();updateNetLabels()}
    function setHoveredDevice(id,visible){if(visible)state.hovered=id;else if(state.hovered===id)state.hovered=null;document.querySelectorAll('#labels .device-label').forEach(label=>label.classList.toggle('visible',label.dataset.labelFor===state.hovered));document.querySelectorAll('#nets .net-label').forEach(label=>label.classList.toggle('visible',label.dataset.a===state.hovered||label.dataset.b===state.hovered))}

    function renderLibrary(){const needle=q('#librarySearch').value.toLowerCase().trim();const items=state.library.filter(item=>(item.title+' '+item.family+' '+item.key).toLowerCase().includes(needle));q('#library').innerHTML=items.map(item=>`<div class="library-item" draggable="true" data-key="${esc(item.key)}"><b>${esc(item.title)}</b><span class="tag ${item.kind==='parametric'?'parametric':item.source==='user'?'user':''}">${item.kind==='parametric'?'参数化':item.source==='user'?'用户注册':'内置 GDS'}</span><span class="tag">${esc(item.family)}</span></div>`).join('')||'<div class="empty">没有匹配器件</div>';document.querySelectorAll('.library-item').forEach(node=>{node.ondragstart=e=>e.dataTransfer.setData('text/plain',node.dataset.key);node.ondblclick=()=>addInstance(node.dataset.key,viewCenter())})}
    function layerColor(layer){let hash=0;for(const c of layer)hash=(hash*31+c.charCodeAt(0))>>>0;return`hsl(${hash%360} 72% 58%)`}
    function canvasLayerKeys(){return[...new Set(state.instances.flatMap(instance=>Object.keys(instance.preview.layers)))].sort((a,b)=>{const av=a.split('/').map(Number),bv=b.split('/').map(Number);return av[0]-bv[0]||av[1]-bv[1]})}
    function isLayerVisible(layer){const key=Array.isArray(layer)?layer.join('/'):String(layer);return!state.hiddenLayers.has(key)}
    function toggleLayer(layer){state.hiddenLayers.has(layer)?state.hiddenLayers.delete(layer):state.hiddenLayers.add(layer);if(state.pending){const instance=instanceById(state.pending.instance),port=instance&&portByName(instance,state.pending.port);if(port&&!isLayerVisible(port.layer))state.pending=null}render()}
    function renderLayerControls(){const layers=canvasLayerKeys(),available=new Set(layers);[...state.hiddenLayers].forEach(layer=>{if(!available.has(layer))state.hiddenLayers.delete(layer)});q('#layerControls').innerHTML=layers.length?layers.map(layer=>`<button class="layer-chip ${isLayerVisible(layer)?'':'off'}" data-layer="${layer}" title="显示或隐藏 ${layer}"><i class="layer-swatch" style="background:${layerColor(layer)}"></i>${layer}</button>`).join(''):'<span class="hint">添加器件后显示</span>';document.querySelectorAll('[data-layer]').forEach(button=>button.onclick=()=>toggleLayer(button.dataset.layer))}
    function polygonPath(polygons){return polygons.map(points=>points.length?'M'+points.map(p=>p[0]+' '+(-p[1])).join('L')+'Z':'').join('')}
    function transformedBBox(instance){const b=instance.preview.bbox_um,corners=[[b[0],b[1]],[b[0],b[3]],[b[2],b[1]],[b[2],b[3]]].map(p=>rotatePoint(p,instance.placement.rotation_deg));return[Math.min(...corners.map(p=>p[0]))+instance.placement.x_um,Math.min(...corners.map(p=>p[1]))+instance.placement.y_um,Math.max(...corners.map(p=>p[0]))+instance.placement.x_um,Math.max(...corners.map(p=>p[1]))+instance.placement.y_um]}
    function render(){renderLayerControls();const used=usedTerminals(),portRadius=portMarkerRadius();q('#devices').innerHTML=state.instances.map(instance=>{const selected=state.selected===instance.id,b=instance.preview.bbox_um,pad=Math.max(b[2]-b[0],b[3]-b[1],1)*.06;let shapes='';Object.entries(instance.preview.layers).forEach(([layer,polygons])=>{if(isLayerVisible(layer))shapes+=`<path data-layout-layer="${layer}" d="${polygonPath(polygons)}" fill="${layerColor(layer)}" fill-opacity=".6" stroke="${layerColor(layer)}" stroke-width=".12" vector-effect="non-scaling-stroke"/>`});const ports=instance.preview.ports.filter(port=>isLayerVisible(port.layer)).map(port=>{const key=terminalKey(instance.id,port.name),pending=state.pending&&state.pending.instance===instance.id&&state.pending.port===port.name;return`<circle class="port ${used.has(key)?'used':''} ${pending?'pending':''}" data-instance="${instance.id}" data-port="${esc(port.name)}" data-port-layer="${port.layer.join('/')}" cx="${port.center_um[0]}" cy="${-port.center_um[1]}" r="${portRadius}" fill="${used.has(key)?'#42d392':'#ff6b6b'}"><title>${esc(instance.id+'.'+port.name)} · ${port.layer.join('/')} · w=${port.width_um}</title></circle>`}).join('');return`<g class="device-shape ${selected?'selected':''}" data-instance="${instance.id}" transform="translate(${instance.placement.x_um} ${-instance.placement.y_um}) rotate(${-instance.placement.rotation_deg})"><rect class="device-box ${selected?'selected':''}" x="${b[0]-pad}" y="${-b[3]-pad}" width="${b[2]-b[0]+2*pad}" height="${b[3]-b[1]+2*pad}"/>${shapes}${ports}</g>`}).join('');
      q('#labels').innerHTML=state.instances.map(instance=>{const b=transformedBBox(instance);return`<text class="device-label ${state.hovered===instance.id?'visible':''}" data-label-for="${esc(instance.id)}" data-left="${b[0]}" data-top="${b[3]}">${esc(instance.id)}</text>`}).join('');renderNets();bindCanvasNodes();renderInspector();renderConnections();updateCanvasOverlays();scheduleDraftSave()}
    function renderNets(){q('#nets').innerHTML=state.nets.map(net=>{const a=net.terminals[0],b=net.terminals[1],ia=instanceById(a.instance),ib=instanceById(b.instance),pa=globalPort(ia,portByName(ia,a.port)),pb=globalPort(ib,portByName(ib,b.port));if(!isLayerVisible(pa.layer)||!isLayerVisible(pb.layer))return'';const centerX=(pa.x+pb.x)/2,centerY=-(pa.y+pb.y)/2,visible=state.hovered===a.instance||state.hovered===b.instance;let d;if(net.route.direct)d=`M${pa.x} ${-pa.y}L${pb.x} ${-pb.y}`;else{const mx=(pa.x+pb.x)/2;d=`M${pa.x} ${-pa.y}L${mx} ${-pa.y}L${mx} ${-pb.y}L${pb.x} ${-pb.y}`}return`<path class="net ${net.route.direct?'direct':'routed'}" data-net-layer="${pa.layer.join('/')}" d="${d}"/><text class="net-label ${visible?'visible':''}" data-a="${esc(a.instance)}" data-b="${esc(b.instance)}" data-center-x="${centerX}" data-center-y="${centerY}">${esc(net.id)}</text>`}).join('')}
    function bindCanvasNodes(){document.querySelectorAll('.device-shape').forEach(node=>{node.onpointerenter=()=>setHoveredDevice(node.dataset.instance,true);node.onpointerleave=()=>setHoveredDevice(node.dataset.instance,false);node.onpointerdown=e=>startDrag(e,node.dataset.instance);node.oncontextmenu=e=>{e.preventDefault();state.selected=node.dataset.instance;render()};node.onclick=e=>{if(e.target.classList.contains('port'))return;state.selected=node.dataset.instance;render()}});document.querySelectorAll('.port').forEach(node=>{node.onpointerdown=e=>e.stopPropagation();node.onclick=e=>{e.stopPropagation();selectPort(node.dataset.instance,node.dataset.port)}})}

    function screenToGds(clientX,clientY){const point=svg.createSVGPoint();point.x=clientX;point.y=clientY;const result=point.matrixTransform(svg.getScreenCTM().inverse());return{x:result.x,y:-result.y}}
    function viewCenter(){const v=svg.viewBox.baseVal;return{x:v.x+v.width/2,y:-(v.y+v.height/2)}}
    function startDrag(event,id){if(event.button!==0)return;state.selected=id;const start=screenToGds(event.clientX,event.clientY),ids=connectedInstanceIds(id),origins=Object.fromEntries(ids.map(instanceId=>{const p=instanceById(instanceId).placement;return[instanceId,{x_um:p.x_um,y_um:p.y_um}]}));state.drag={id,ids,start,origins};svg.setPointerCapture(event.pointerId);if(ids.length>1)status(`正在整体移动 ${ids.length} 个已连接器件`);render()}
    svg.onpointermove=e=>{if(!state.drag)return;const p=screenToGds(e.clientX,e.clientY),dx=p.x-state.drag.start.x,dy=p.y-state.drag.start.y;state.drag.ids.forEach(id=>{const instance=instanceById(id),origin=state.drag.origins[id];instance.placement.x_um=origin.x_um+dx;instance.placement.y_um=origin.y_um+dy});render()};
    svg.onpointerup=async e=>{if(!state.drag)return;const drag=state.drag;state.drag=null;if(drag.ids.length===1){try{await tryAutoSnap(drag.id)}catch(error){status('吸附失败：'+error.message,'error')}}else status(`已整体移动 ${drag.ids.length} 个已连接器件`,'success');render()};

    async function tryAutoSnap(instanceId){const moving=instanceById(instanceId),used=usedTerminals(),threshold=svg.viewBox.baseVal.width/Math.max(svg.clientWidth,1)*18;let best=null;for(const mp of moving.preview.ports){if(used.has(terminalKey(instanceId,mp.name)))continue;const current=globalPort(moving,mp);for(const target of state.instances){if(target.id===instanceId)continue;for(const tp of target.preview.ports){if(used.has(terminalKey(target.id,tp.name)))continue;const other=globalPort(target,tp);if(!compatible(current,other))continue;const desired=normalize(other.orientation+180-mp.orientation_deg);if(Math.abs(desired/90-Math.round(desired/90))>1e-6)continue;const distance=Math.hypot(current.x-other.x,current.y-other.y);if(distance<=threshold&&(!best||distance<best.distance))best={distance,movingPort:mp.name,targetId:target.id,targetPort:tp.name}}}}if(!best)return;const answer=await post('/api/snap',{instances:serializeInstances(),moving_instance:instanceId,moving_port:best.movingPort,target_instance:best.targetId,target_port:best.targetPort});moving.placement=answer.placement;state.nets.push({id:nextNetId(),terminals:[{instance:best.targetId,port:best.targetPort},{instance:instanceId,port:best.movingPort}],route:{direct:true}});state.pending=null;status(`已吸附并连接 ${best.targetId}.${best.targetPort} ↔ ${instanceId}.${best.movingPort}`,'success')}
    function selectPort(instanceId,portName){const used=usedTerminals(),key=terminalKey(instanceId,portName);if(used.has(key)){status('该端口已经连接；可在右侧先删除对应连接。','error');return}if(!state.pending){state.pending={instance:instanceId,port:portName};status(`已选择 ${instanceId}.${portName}，请再选择另一个端口`);render();return}if(state.pending.instance===instanceId&&state.pending.port===portName){state.pending=null;render();return}const a=state.pending,b={instance:instanceId,port:portName},ia=instanceById(a.instance),ib=instanceById(b.instance),pa=globalPort(ia,portByName(ia,a.port)),pb=globalPort(ib,portByName(ib,b.port));if(!compatible(pa,pb)){status(`端口层或宽度不兼容：${a.instance}.${a.port} ↔ ${b.instance}.${b.port}`,'error');return}const direct=Math.hypot(pa.x-pb.x,pa.y-pb.y)<=.001&&Math.abs(normalize(pa.orientation-pb.orientation)-180)<=1e-6;state.nets.push({id:nextNetId(),terminals:[a,b],route:direct?{direct:true}:{}});state.pending=null;status(direct?'已记录直接端口接触':'已记录自动布线连接；导出时生成真实 route','success');render()}

    async function addInstance(key,at){const item=state.library.find(value=>value.key===key);if(!item)return;status('读取器件…');try{const preview=await post('/api/preview',{key,parameters:item.parameters});const base=(item.family||item.title).replace(/[^A-Za-z0-9_]+/g,'_').replace(/^([^A-Za-z_])/,'d_$1').slice(0,18)||'device',id=nextInstanceId(base);state.instances.push({id,library_key:key,component:preview.component,parameters:preview.parameters,placement:{x_um:at.x,y_um:at.y,rotation_deg:0},preview});state.selected=id;status(`已放置：${id}`,'success');render()}catch(error){status('器件加载失败：'+error.message,'error')}}

    function groupCenter(ids){return{x:ids.reduce((sum,id)=>sum+instanceById(id).placement.x_um,0)/ids.length,y:ids.reduce((sum,id)=>sum+instanceById(id).placement.y_um,0)/ids.length}}
    function rigidTransform(ids,fromPivot,toPivot,rotationDelta){ids.forEach(id=>{const instance=instanceById(id),relative=[instance.placement.x_um-fromPivot.x,instance.placement.y_um-fromPivot.y],rotated=rotatePoint(relative,rotationDelta);instance.placement.x_um=toPivot.x+rotated[0];instance.placement.y_um=toPivot.y+rotated[1];instance.placement.rotation_deg=normalize(instance.placement.rotation_deg+rotationDelta)})}
    function transformConnectedGroup(anchorId,target){const anchor=instanceById(anchorId),ids=connectedInstanceIds(anchorId),from={x:anchor.placement.x_um,y:anchor.placement.y_um},rotationDelta=normalize(target.rotation_deg-anchor.placement.rotation_deg);rigidTransform(ids,from,{x:target.x_um,y:target.y_um},rotationDelta);return ids}
    function rotateSelectedGroup(){const instance=instanceById(state.selected);if(!instance)return;const ids=connectedInstanceIds(instance.id),pivot=groupCenter(ids);rigidTransform(ids,pivot,pivot,90);status(ids.length>1?`已整体旋转 ${ids.length} 个已连接器件`:'器件已旋转 90°','success');render()}
    function formatMicrons(value){return Number(value).toFixed(6).replace(/\.?0+$/,'')}
    function renderInspector(){const root=q('#inspector'),instance=instanceById(state.selected);if(!instance){root.innerHTML='<div class="empty">右键器件设置参数<br>单击端口后再单击另一端口可布线</div>';return}const item=itemFor(instance),connected=incident(instance.id).length>0,locked=connected?' disabled':'',portDetails=item.kind==='registered'?`<div class="section-title">端口</div>${instance.preview.ports.map(port=>`<div class="connection"><b>${esc(port.name)}</b> · 宽度 ${formatMicrons(port.width_um)} μm · 层 ${port.layer.join('/')}</div>`).join('')||'<div class="hint">未登记端口</div>'}`:'';let parameterFields='';if(item.kind==='parametric'){parameterFields=(item.fields||[]).map(field=>{const value=instance.parameters[field.name]??'';if(field.type==='choice')return`<div class="field"><label>${esc(field.name)}</label><select data-param="${esc(field.name)}"${locked}>${field.options.map(option=>`<option ${String(option)===String(value)?'selected':''}>${esc(option)}</option>`).join('')}</select></div>`;return`<div class="field"><label>${esc(field.name)}</label><input type="text" inputmode="decimal" data-param="${esc(field.name)}" value="${value}"${locked}></div>`}).join('')}else{const variants=state.library.filter(value=>value.kind==='registered'&&value.family===item.family);parameterFields=`<div class="field"><label>同族真实 GDS 版本</label><select id="variant"${locked}>${variants.map(value=>`<option value="${esc(value.key)}" ${value.key===instance.library_key?'selected':''}>${esc(value.title)} · ${esc(value.source)}</option>`).join('')}</select></div><div class="hint">黑盒几何不做数值拉伸；参数变化通过真实模板版本切换。</div>`}root.innerHTML=`<div class="card"><div class="row"><b>${esc(instance.id)}</b><span class="tag">${esc(instance.preview.family)}</span></div><div class="form-grid"><div class="field"><label>X / μm</label><input id="posX" type="text" inputmode="decimal" value="${instance.placement.x_um}"></div><div class="field"><label>Y / μm</label><input id="posY" type="text" inputmode="decimal" value="${instance.placement.y_um}"></div></div><div class="field"><label>旋转</label><select id="rotation">${[0,90,180,270].map(value=>`<option ${value===instance.placement.rotation_deg?'selected':''}>${value}</option>`).join('')}</select></div>${parameterFields}${portDetails}<p class="hint">${connected?'位置和旋转将应用于整个连通器件组；几何参数和模板版本保持锁定。':'可修改位置、旋转和参数。'}</p><div class="row"><button class="primary" id="applyProps">应用</button><button class="danger" id="deleteDevice">删除器件</button></div></div>`;q('#applyProps').onclick=applyProperties;q('#deleteDevice').onclick=deleteSelected}
    async function applyProperties(){const instance=instanceById(state.selected);if(!instance)return;const target={x_um:Number(q('#posX').value),y_um:Number(q('#posY').value),rotation_deg:Number(q('#rotation').value)};if(!Number.isFinite(target.x_um)||!Number.isFinite(target.y_um)){status('位置必须是有效数字','error');return}if(incident(instance.id).length){const ids=transformConnectedGroup(instance.id,target);status(`已整体变换 ${ids.length} 个已连接器件`,'success');render();return}const item=itemFor(instance),key=item.kind==='registered'?q('#variant').value:instance.library_key,selectedItem=state.library.find(value=>value.key===key),parameters={...selectedItem.parameters};if(selectedItem.kind==='parametric')document.querySelectorAll('[data-param]').forEach(input=>{parameters[input.dataset.param]=input.tagName==='SELECT'?input.value:Number(input.value)});try{status('正在校验参数和重新生成几何…');const preview=await post('/api/preview',{key,parameters});instance.library_key=key;instance.component=preview.component;instance.parameters=preview.parameters;instance.preview=preview;instance.placement=target;status('属性已应用','success');render()}catch(error){status('属性无效：'+error.message,'error')}}
    function deleteSelected(){const id=state.selected;if(!id)return;const count=incident(id).length;if(count&&!confirm(`删除器件会同时删除 ${count} 条连接，是否继续？`))return;state.instances=state.instances.filter(item=>item.id!==id);state.nets=state.nets.filter(net=>!net.terminals.some(t=>t.instance===id));reindexNets();state.selected=null;state.pending=null;state.hovered=null;status('器件已删除');render()}
    function renderConnections(){const root=q('#connections');if(!state.nets.length){root.innerHTML='尚无连接';return}root.innerHTML=state.nets.map(net=>`<div class="connection row"><span><b>${esc(net.id)}</b><br>${esc(net.terminals[0].instance+'.'+net.terminals[0].port)} ↔ ${esc(net.terminals[1].instance+'.'+net.terminals[1].port)} · ${net.route.direct?'吸附':'布线'}</span><button data-remove-net="${esc(net.id)}">删除</button></div>`).join('');document.querySelectorAll('[data-remove-net]').forEach(button=>button.onclick=()=>{state.nets=state.nets.filter(net=>net.id!==button.dataset.removeNet);reindexNets();state.pending=null;status('连接已删除');render()})}
    function fitView(){if(!state.instances.length){svg.setAttribute('viewBox','-120 -90 240 180');return}const boxes=state.instances.map(transformedBBox),xmin=Math.min(...boxes.map(b=>b[0])),ymin=Math.min(...boxes.map(b=>b[1])),xmax=Math.max(...boxes.map(b=>b[2])),ymax=Math.max(...boxes.map(b=>b[3])),pad=Math.max(xmax-xmin,ymax-ymin,20)*.12;svg.setAttribute('viewBox',`${xmin-pad} ${-ymax-pad} ${xmax-xmin+2*pad} ${ymax-ymin+2*pad}`)}
    async function exportDesign(){const cluster=q('#clusterName').value.trim();if(!/^[A-Za-z_][A-Za-z0-9_]{0,31}$/.test(cluster)){status('版图名须为不超过 32 位的英文标识符','error');return}if(!state.instances.length){status('请先放置器件','error');return}q('#export').disabled=true;status('生成并验证 GDS…');try{const result=await post('/api/export',{cluster_name:cluster,instances:serializeInstances(),nets:state.nets});const links=Object.entries(result.artifacts).map(([name,file])=>`<a href="/api/artifact?file=${encodeURIComponent(file)}" target="_blank">${esc(name)} · ${esc(file.split('/').pop())}</a>`).join('');const preview=result.artifacts.preview?`<img src="/api/artifact?file=${encodeURIComponent(result.artifacts.preview)}" alt="导出版图预览">`:'';q('#artifacts').innerHTML=`<div class="artifact card"><b class="success">验证通过</b><div class="hint">${esc(result.output_dir)}</div>${links}${preview}</div>`;status('导出完成：'+result.output_dir,'success')}catch(error){q('#artifacts').innerHTML=`<div class="error">${esc(error.message)}</div>`;status('导出失败：'+error.message,'error')}finally{q('#export').disabled=false}}

    q('#librarySearch').oninput=renderLibrary;q('#refreshLibrary').onclick=loadLibrary;q('#saveDraft').onclick=()=>saveDraft(true);q('#restoreDraft').onclick=()=>restoreDraft(false).catch(error=>{setDraftStatus('恢复失败：'+error.message,true);status('草稿恢复失败：'+error.message,'error')});q('#clearDraft').onclick=()=>{if(confirm('清除已保存的画布草稿？'))clearDraft()};q('#clusterName').oninput=scheduleDraftSave;q('#stage').ondragover=e=>e.preventDefault();q('#stage').ondrop=e=>{e.preventDefault();const key=e.dataTransfer.getData('text/plain');addInstance(key,screenToGds(e.clientX,e.clientY))};q('#fit').onclick=()=>{fitView();render()};q('#rotate').onclick=rotateSelectedGroup;q('#clear').onclick=()=>{if(state.instances.length&&!confirm('清空当前画布和全部连接？'))return;state.instances=[];state.nets=[];state.hiddenLayers=new Set();state.selected=null;state.pending=null;state.hovered=null;render();status('画布已清空')};q('#export').onclick=exportDesign;
    svg.onwheel=e=>{e.preventDefault();const v=svg.viewBox.baseVal,f=e.deltaY>0?1.15:.87,p=screenToGds(e.clientX,e.clientY),sx=p.x,sy=-p.y;const nx=sx-(sx-v.x)*f,ny=sy-(sy-v.y)*f;svg.setAttribute('viewBox',`${nx} ${ny} ${v.width*f} ${v.height*f}`);updateCanvasOverlays()},{passive:false};
    window.addEventListener('resize',updateCanvasOverlays);
    async function loadLibrary(){status('读取器件库…');try{const items=await api('/api/library'),initial=!state.ready;state.library=items;renderLibrary();if(initial){let restored=false;try{restored=await restoreDraft(true)}catch(error){setDraftStatus('恢复失败：'+error.message,true)}if(!restored)render();state.ready=true;if(!restored)status(`器件库：${items.length}`,'success')}else{render();status(`器件库：${items.length}`,'success')}}catch(error){q('#library').innerHTML=`<div class="card error">服务不可用：${esc(error.message)}<p><button id="retryLibrary">重试</button></p></div>`;q('#retryLibrary').onclick=loadLibrary;status('器件库加载失败','error')}}
    loadLibrary();
  </script>
</body>
</html>
